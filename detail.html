<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hiển thị sản phẩm - API với JS thuần + Bootstrap 5.3</title>
        <!-- Bootstrap 5.3 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- Font Awesome (tùy chọn, làm đẹp icon) -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
        .product-img {
            height: 200px;
            object-fit: contain;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d63384;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            padding: 2rem;
        }
        .product-title {
            font-size: 1rem;
            font-weight: 600;
            height: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
    </style>
    </head>
    <body class="bg-light">

        <div class="container py-4">
            <!-- Header -->
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-primary">
                    <i class="fas fa-store me-2"></i>Chi tiết sản phẩm
                </h1>
                <p class="lead">Dữ liệu được lấy từ API FakeStore</p>
                <button class="btn btn-primary btn-sm"
                    onclick="window.history.back();">
                    Quay lai trang chu
                </button>
            </div>

            <!-- Hiển thị loading, lỗi hoặc nội dung -->
            <div id="productContainer">
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <span class="ms-3">Đang tải sản phẩm...</span>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS Bundle (tùy chọn cho một số component nhưng không bắt buộc) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // lay tham so : ID cua san pham
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const idPd = urlParams.has('id') ? urlParams.get('id') : 0; // lay gia tri id tren URL
            const idNumber = Number(idPd); // ep ve so
            const id = Number.isFinite(idNumber) ? idNumber : 0; // kiem tra ma san pham phai la so
            const API_URL = `https://fakestoreapi.com/products/${id}`;

            document.addEventListener("DOMContentLoaded", () => {
                fetchDetailProductById();
            });

            function showLoading(container){
                container.innerHTML = `
                    <div class="loading">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Đang tải...</span>
                        </div>
                        <span class="ms-3">Đang tải sản phẩm...</span>
                    </div>
                `;
            }
            async function fetchDetailProductById(){
                const container = document.getElementById("productContainer");
                // loading
                showLoading(container);
                try {
                    const response = await fetch(API_URL);
                    if(!response.ok){
                        throw new Error(`co loi xay ra : ${response.status} `);
                    }
                    const product = await response.json();
                    if(!product || product.length === 0){
                        // khong co san pham theo ma id
                        renderProductEmpty();
                    } else {
                        // co ton tai san pham theo ma id
                        renderProductDetail(product);
                    }
                    
                } catch (error) {
                    console.log("Loi khi goi API", error);
                    // hien thi loi
                    renderError("Khong the hien thi thong tin san pham !");
                }
            }
            function renderProductDetail(product){
                const container = document.getElementById("productContainer");
                // xu ly hien thi don vi tien te theo usd
                const formartedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(product.price);
                // hien thi thong tin
                const detailHTML = `
                <div class="product-card">
                    <div class="row g-0">
                        <div class="col-sm-12 col-md-6">
                            <img src="${product.image}" class="product-image" alt="${product.title}" />
                        </div>
                        <div class="col-sm-12 col-md-6">
                            <div class="p-4 p-lg-5">
                                <!-- danh muc -->
                                <div class="mb-3">
                                    <span class="category-badge">
                                        <i class="fas fa-tag me-2"></i>
                                        ${product.category}
                                    </span>
                                </div>
                                <!-- Title / tieu de -->
                                <h1 class="display-6 fw-bold mb-3">${product.title}</h1>
                                <!-- Price / gia -->
                                <div class="mb-3">
                                    <span class="price">${formartedPrice}</span>
                                </div>
                                <!-- Mo ta san pham -->
                                <div class="info-section">
                                    <h5 class="fw-bold mb-3">
                                        <i class="fas fa-align-left me-2 text-primary"></i>Mo ta san pham
                                    </h5>
                                    <p class="text-muted lead">${product.description}</p>
                                </div>
                                <!-- Thong tin  -->
                                <div class="info-section">
                                    <h5 class="fw-bold mb-3">
                                        <i class="fas fa-info-cicrle me-2 text-primary"></i>Thong tin chi tiet
                                    </h5>
                                    <ul class="list-unstyled">
                                        <li class="mb-2">
                                            <i class="fas fa-chart-line me-2 text-primary"></i>
                                            <strong>Danh gia Trung binh</strong>
                                            ${product.rating.rate}
                                        </li>
                                        <li class="mb-2">
                                            <i class="fas fa-users me-2 text-primary"></i>
                                            <strong>Luot danh gia</strong>
                                            ${product.rating.count}
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                `;
                container.innerHTML = detailHTML;
            }
            function renderProductEmpty(){
                const container = document.getElementById("productContainer");
                container.innerHTML = `
                <div class="alert alert-warning text-center" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <p> San pham khong co trong he thong !</p>
                </div>
                `;
            }

            function renderError(message){
                const container = document.getElementById("productContainer");
                container.innerHTML = `
                    <div class="error-message">
                        <i class="fas fa-exclamation-cricle fa-3x mb-3"></i>
                        <h3> Da xay ra loi !</h3>
                        <p>${message}</p>
                    </div>
                `;
            }
            
        </script>
    </body>
</html>

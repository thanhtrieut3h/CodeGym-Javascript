<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hiển thị sản phẩm - API với JS thuần + Bootstrap 5.3</title>
        <!-- Bootstrap 5.3 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- Font Awesome (tùy chọn, làm đẹp icon) -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
        .product-img {
            height: 200px;
            object-fit: contain;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d63384;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            padding: 2rem;
        }
        .product-title {
            font-size: 1rem;
            font-weight: 600;
            height: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
    </style>
    </head>
    <body class="bg-light">

        <div class="container py-4">
            <!-- Header -->
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-primary">
                    <i class="fas fa-store me-2"></i>Chi tiet sản phẩm
                </h1>
                <p class="lead">Dữ liệu được lấy từ API FakeStore</p>
                <button class="btn btn-primary btn-sm"
                    onclick="window.history.back();">
                    Quay lai 
                </button>
            </div>

            <!-- Hiển thị loading, lỗi hoặc nội dung -->
            <div id="productDetailContainer">
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <span class="ms-3">Đang tải sản phẩm...</span>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS Bundle (tùy chọn cho một số component nhưng không bắt buộc) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            // lay tham so : ID cua san pham
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const idPd = urlParams.has('id') ? urlParams.get('id') : 0; // lay gia tri id tren URL
            const idNumber = Number(idPd);
            const id = Number.isFinite(idNumber) ? idNumber : 0;
            const API_URL = `https://fakestoreapi.com/products/${id}`;

            // goi chay chuong trinh
            function init(){
                fetchProductDetail();
            }
            // bat su kien khi trang web dc tai xong
            document.addEventListener('DOMContentLoaded', init);

            // Hàm fetch chi tiết sản phẩm
            async function fetchProductDetail() {
                const container = document.getElementById('productDetailContainer');
            
            // Hiển thị loading
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <span class="ms-3">Đang tải sản phẩm...</span>
                </div>
            `;
            
            try {
                // Gọi API bằng fetch thuần
                const response = await fetch(API_URL);
                
                // Kiểm tra response
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                // Parse JSON
                const product = await response.json();
                
                // Hiển thị chi tiết sản phẩm
                renderProductDetail(product);
                
            } catch (error) {
                console.error('Lỗi khi gọi API:', error);
                renderError('Không thể tải thông tin sản phẩm. Vui lòng kiểm tra kết nối mạng hoặc thử lại sau.');
            }
            }
        // Hàm hiển thị chi tiết sản phẩm với Bootstrap
        function renderProductDetail(product) {
            const container = document.getElementById('productDetailContainer');
            
            // Format giá tiền
            const formattedPrice = new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(product.price);
            
            // Hiển thị rating sao
            //const ratingStars = displayRatingStars(product.rating.rate);
            
            // HTML hiển thị chi tiết
            const detailHTML = `
                <div class="product-card">
                    <div class="row g-0">
                        <div class="col-md-6">
                            <img src="${product.image}" class="product-image" alt="${product.title}">
                        </div>
                        <div class="col-md-6">
                            <div class="p-4 p-lg-5">
                                <!-- Category -->
                                <div class="mb-3">
                                    <span class="category-badge">
                                        <i class="fas fa-tag me-2"></i>${product.category}
                                    </span>
                                </div>
                                
                                <!-- Title -->
                                <h1 class="display-6 fw-bold mb-3">${product.title}</h1>
                                
                                <!-- Price -->
                                <div class="mb-4">
                                    <span class="price">${formattedPrice}</span>
                                </div>
                                
                                <!-- Description -->
                                <div class="info-section">
                                    <h5 class="fw-bold mb-3">
                                        <i class="fas fa-align-left me-2 text-primary"></i>Mô tả sản phẩm
                                    </h5>
                                    <p class="text-muted lead">${product.description}</p>
                                </div>
                                
                                <!-- Product Info -->
                                <div class="info-section">
                                    <h5 class="fw-bold mb-3">
                                        <i class="fas fa-info-circle me-2 text-primary"></i>Thông tin chi tiết
                                    </h5>
                                    <ul class="list-unstyled">
                                        <li class="mb-2">
                                            <i class="fas fa-hashtag me-2 text-primary"></i>
                                            <strong>Mã sản phẩm:</strong> #${product.id}
                                        </li>
                                        <li class="mb-2">
                                            <i class="fas fa-chart-line me-2 text-primary"></i>
                                            <strong>Đánh giá trung bình:</strong> ${product.rating.rate}/5.0
                                        </li>
                                        <li class="mb-2">
                                            <i class="fas fa-users me-2 text-primary"></i>
                                            <strong>Lượt đánh giá:</strong> ${product.rating.count}
                                        </li>
                                    </ul>
                                </div>
                                
                                <!-- Action Buttons -->
                                <div class="mt-4 d-flex gap-3">
                                    <button class="btn btn-primary btn-lg flex-grow-1" onclick="alert('Tính năng đang phát triển!')">
                                        <i class="fas fa-shopping-cart me-2"></i>Thêm vào giỏ
                                    </button>
                                    <button class="btn btn-outline-primary btn-lg" onclick="shareProduct()">
                                        <i class="fas fa-share-alt"></i>
                                    </button>
                                </div>
                                
                                <!-- Stock info -->
                                <div class="mt-3 text-success">
                                    <i class="fas fa-check-circle me-1"></i>Còn hàng
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            container.innerHTML = detailHTML;
        }

        // Hàm hiển thị lỗi
        function renderError(message) {
            const container = document.getElementById('productDetailContainer');
            container.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
                    <h3 class="text-danger mb-3">Đã xảy ra lỗi!</h3>
                    <p class="text-muted">${message}</p>
                </div>
            `;
        }
            
        </script>
    </body>
</html>

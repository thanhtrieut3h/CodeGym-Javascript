<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Hiển thị sản phẩm - API với JS thuần + Bootstrap 5.3</title>
        <!-- Bootstrap 5.3 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <!-- Font Awesome (tùy chọn, làm đẹp icon) -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
        .product-img {
            height: 200px;
            object-fit: contain;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .card {
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #d63384;
        }
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            padding: 2rem;
        }
        .product-title {
            font-size: 1rem;
            font-weight: 600;
            height: 48px;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
    </style>
    </head>
    <body class="bg-light">

        <div class="container py-4">
            <!-- Header -->
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-primary">
                    <i class="fas fa-store me-2"></i>Danh sách sản phẩm
                </h1>
                <p class="lead">Dữ liệu được lấy từ API FakeStore</p>
                <button class="btn btn-primary btn-sm"
                        onclick="location.reload(true);"> 
                        Lam moi du lieu
                </button>
            </div>

            <!-- Hiển thị loading, lỗi hoặc nội dung -->
            <div id="productContainer">
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <span class="ms-3">Đang tải sản phẩm...</span>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS Bundle (tùy chọn cho một số component nhưng không bắt buộc) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        // xu ly de call du lieu tu API
        const API_URL = 'https://fakestoreapi.com/products'; // lay du lieu va hien thi

        // viet ham de xu ly lay du lieu tu API
        async function fetchProducts(){
            const container = document.getElementById("productContainer");
            // hien thi trang thai loading lay san pham(nguoi dung cho he thong xu ly)
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Đang tải...</span>
                    </div>
                    <span class="ms-3">Đang tải sản phẩm...</span>
                </div>
            `;
            try {
                // khong co loi hay dieu gi xau xay ra
                const response = await fetch(API_URL);
                if(!response.ok){
                    // khong lay duoc du lieu tu API
                    throw new Error(`Error status : ${response.status}`);
                }
                const products = await response.json(); // convert ve object js
                // kiem tra xem co san pham nao ko ?
                if(!products || products.length === 0){
                    // khong co san nao de hien thi
                    renderEmptyState();
                } else {
                    // hien thi san pham cho nguoi dung xem
                    renderProductions(products);
                }

            } catch (error) {
                // co loi xay ra
                console.log("Loi goi API: ", error);
                // thong bao loi ra man hinh
                renderError("Co loi xay ra, vui long thu lai sau");
            }
        }
        // viet ham de hien thi thong tin san pham
        function renderProductions(products){
            const container = document.getElementById("productContainer");
            // tao template hien thi khung giao dien
            let pdHtml = `
                <div class="row g-4">
            `;
            // xu ly hien thi san pham
            products.forEach(pd => {
                // xu ly hien thi don vi tien te theo usd
                const formartedPrice = new Intl.NumberFormat('en-US', {
                    style: 'currency',
                    currency: 'USD'
                }).format(pd.price);
                // xu ly hien thi mo ta ngan gon san pham
                const shortDesc = pd.description.length > 100
                                  ? pd.description.substring(0, 100) + '...'
                                  : pd.description;
                pdHtml += `
                    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                        <div class="card h-100 shadow-sm border-0">
                            <img src="${pd.image}"
                                class="card-img-top product-img"
                                alt="${pd.title}"
                                loading="lazy"/>
                            <div class="card-body d-flex flex-column">
                                <h5 class="product-title card-title">
                                    ${pd.title}
                                </h5>
                                <p class="card-text text-muted small">
                                    ${shortDesc}
                                </p>
                                <div class="mt-auto">
                                    <div class="d-flex justify-content-between aligin-items-center">
                                        <span class="price">${formartedPrice}</span>
                                        <span class="badge bg-secondary mb-0">
                                            ${pd.category}
                                        </span>
                                    </div>
                                    <a href="detail.html?id=${pd.id}" class="btn btn-sm btn-outline-primary w-100 mt-3 view-detail">
                                        <i class="fas fa-info-circle me-1"></i> Xem chi tiet
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

            });

            pdHtml += `</div>`;
            container.innerHTML = pdHtml;
        }

        // viet ham thong bao khong co san pham nao de hien thi
        function renderEmptyState(){
            const container = document.getElementById("productContainer");
            container.innerHTML = `
                <div class="alert alert-warning text-center" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <p> Khong co san pham nao de hien thi</p>
                </div>
            `;
        }

        // viet ham hien thi thong bao loi
        function renderError(message){
            const container = document.getElementById("productContainer");
            container.innerHTML = `
                <div class="error-message">
                    <i class="fas fa-exclamation-cricle fa-3x mb-3"></i>
                    <h3> Da xay ra loi !</h3>
                    <p>${message}</p>
                </div>
            `;
        }

        // goi chay chuong trinh
        function init(){
            fetchProducts();
        }
        // bat su kien khi trang web dc tai xong
        document.addEventListener('DOMContentLoaded', init);

    </script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiem tra nam nhuan DL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-sm-12 col-md-6 offset-md-3 border mt-3 p-3">
                <h2 class="my-3 text-center"> Kiem tra nam nhuan DL </h2>
                <div class="mb-3">
                    <label class="form-label" for="year"> Moi nhap nam</label>
                    <input class="form-control" id="year" placeholder="Nhap nam ..." />
                </div>
                <button id="btnCheck" class="btn btn-primary btn-lg"> Kiem Tra</button>
                <p class="form-text mt-3" id="result"></p>
            </div>
        </div>
    </div>
    <script>
        let btnCheck = document.getElementById("btnCheck");
        btnCheck.onclick = function(){
            let message = document.getElementById("result");
            let inputYear = document.getElementById("year");
            let year = inputYear.value.trim(); // gia tri nguoi dung nhap vao - string
            let realYear = Number(year); // ep ve kieu so
            if(!Number.isFinite(realYear) || year.length === 0){
                // nguoi dung nhap vao khong phai so
                alert("Vui long nhap so");
                message.innerHTML = "";
                return;
            }
            let check = kiemTraNamDL(realYear);
            if(check){
                message.innerHTML = `${realYear} la nam nhuan duong lich`;
            } else {
                message.innerHTML = `${realYear} khong phai la nam nhuan duong lich`;
            }

        }
        function kiemTraNamDL(year){
            if((year % 400 === 0) || ( year % 4 === 0 && year % 100 !== 0)){
                return true;
            }
            return false;
        }
    </script>
</body>
</html>
